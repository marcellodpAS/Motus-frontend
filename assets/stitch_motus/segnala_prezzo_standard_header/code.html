<section class="bg-surface p-4 shadow-[0px_1px_2px_rgba(60,64,67,0.3),0px_1px_3px_1px_rgba(60,64,67,0.15)] flex items-center gap-4 border border-border-subtle rounded-2xl">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary">local_gas_station</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Shell Station</h2>
<p class="font-body-md text-body-md text-on-surface-variant">123 Main Street</p>
</div>
</section>
<!-- Form Section -->
<form class="flex flex-col gap-6 bg-surface p-6 shadow-[0px_1px_2px_rgba(60,64,67,0.3),0px_1px_3px_1px_rgba(60,64,67,0.15)] border border-border-subtle rounded-2xl" onsubmit="event.preventDefault();">

</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="diesel-price">Diesel</label>

<span class="absolute left-4 top-1/2 -translate-y-1/2 font-headline-lg text-headline-lg text-on-surface-variant">$</span>

</button>
